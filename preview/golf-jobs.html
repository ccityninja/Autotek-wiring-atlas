<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070b10">
<title>Golf Mk5 · Select the job</title>
<style>
:root{--bg:#070b10;--line:#24384a;--text:#eaf2f8;--muted:#8fa3b5;--acc:#c4ed76;--ink:#04121c}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
a,button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
.bar{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);
  position:sticky;top:0;background:rgba(7,11,16,.9);backdrop-filter:blur(12px);z-index:4}
.bar a,.bar button{border:1px solid var(--line);background:#101820;border-radius:999px;padding:7px 12px;
  text-decoration:none;cursor:pointer;min-height:40px}
.bar .search{flex:1;min-width:0}
.bar input{width:100%;border:1px solid var(--line);background:#101820;border-radius:999px;color:#fff;
  padding:10px 14px;min-height:40px}
.tabs{display:flex;gap:6px;padding:8px 12px;border-bottom:1px solid var(--line);overflow:auto}
.tabs span{padding:8px 12px;border-radius:999px;color:var(--muted);white-space:nowrap}
.tabs .on{background:#16232e;color:var(--acc)}
main{max-width:1040px;margin:0 auto;padding:28px 16px 80px}
h1{font-size:clamp(26px,5vw,36px);margin:0 0 6px;letter-spacing:-.02em}
.lead{color:var(--muted);margin:0 0 22px}
h2{margin:28px 0 10px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.jobs{display:grid;gap:12px;grid-template-columns:1fr 1fr}
@media(min-width:860px){.jobs{grid-template-columns:repeat(4,1fr)}}
.job{min-height:118px;border-radius:16px;border:1px solid #2f4252;background:#14212c;padding:16px 18px;
  text-align:left;cursor:pointer;display:flex;flex-direction:column;justify-content:center;gap:4px}
.job:hover{border-color:var(--acc);background:#1a2a37}
.job .i{font-size:28px}
.job b{font-size:18px}
.job small{color:var(--muted);font-size:13px}
.skip{display:inline-block;margin-top:22px;color:var(--acc);font-weight:700;text-decoration:none;min-height:44px}
</style>
</head>
<body>
<header class="bar">
  <a href="../index.html">← All cars</a>
  <a href="./golf-jobs.html" aria-current="page">Home</a>
  <div class="search"><input type="search" placeholder="Search: J220, sw/ge, fuse 27, T94/68, no start…" aria-label="Search"></div>
</header>
<nav class="tabs" aria-label="Workspace">
  <span>Map</span><span>Modules</span><span>Fuses</span><span>Grounds</span><span>Tools</span>
</nav>
<main>
  <h1>Select the job</h1>
  <p class="lead">Golf Mk5 · 1K1 · BLX / 09G. Select a fault. The atlas opens the correct view.</p>

  <h2>Faults</h2>
  <div class="jobs">
    <button class="job"><span class="i">🔑</span><b>No start</b><small>Immobiliser, ECU feeds, starter</small></button>
    <button class="job"><span class="i">🌀</span><b>Cranks, fans on full</b><small>ECU offline · guided checklist</small></button>
    <button class="job"><span class="i">📡</span><b>No comms</b><small>Gateway, CAN, OBD, termination</small></button>
    <button class="job"><span class="i">🔒</span><b>Locking / keys</b><small>Central locking, keyfob, BCM</small></button>
    <button class="job"><span class="i">🛞</span><b>ABS</b><small>J104 feeds, sensors, CAN</small></button>
    <button class="job"><span class="i">⚙</span><b>Gearbox</b><small>09G J217, selector, limp</small></button>
    <button class="job"><span class="i">💥</span><b>Blown fuses</b><small>Known Mk5 faults · checks</small></button>
  </div>

  <h2>Lookups</h2>
  <div class="jobs">
    <button class="job"><span class="i">⚡</span><b>Fuses</b><small>SB/SC carriers &amp; relays</small></button>
    <button class="job"><span class="i">⏚</span><b>Grounds</b><small>Earth points and tests</small></button>
    <button class="job"><span class="i">⌘</span><b>Connectors</b><small>Faces, terminals, circuits</small></button>
    <button class="job"><span class="i">▦</span><b>Modules</b><small>J-codes and pinouts</small></button>
  </div>

  <a class="skip" href="#">Show the map → modules only</a>
</main>
</body>
</html>
